<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Freemee — Debt Review Tracker 2026</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap');
:root{
  --g1:#062518;--g2:#0a3d28;--g3:#0f5c3a;--g4:#1a8a56;
  --gl:#e6f7ee;--gp:#f0faf4;--pu:#534ab7;--pul:#eeedfe;
  --am:#ba7517;--aml:#faeeda;--rd:#c0392b;--rdl:#fdf0ef;
  --bl:#185fa5;--bll:#e6f1fb;
  --ink:#1a1a18;--inkm:#444441;--inkg:#88887f;--inkf:#c8c8c0;
  --sf:#ffffff;--bg:#f4f4ef;--bd:#e2e2da;--r:10px;--rl:14px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"DM Sans",sans-serif;background:var(--bg);color:var(--ink);font-size:14px;line-height:1.5;min-height:100vh}
.topbar{background:var(--g1);height:54px;padding:0 24px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:200}
.tb-brand{display:flex;align-items:center;gap:10px}
.tb-logo{width:30px;height:30px;background:var(--g3);border-radius:7px;display:flex;align-items:center;justify-content:center}
.tb-logo svg{width:17px;height:17px;fill:#fff}
.tb-name{color:#fff;font-size:15px;font-weight:600;letter-spacing:-.3px}
.tb-sub{color:rgba(255,255,255,.4);font-size:11px}
.tb-right{display:flex;align-items:center;gap:10px}
#sync-dot{width:7px;height:7px;border-radius:50%;background:#f87171}
#sync-dot.ok{background:#4ade80;animation:blink 2s infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.35}}
#sync-txt{font-size:11px;color:rgba(255,255,255,.5);font-family:"DM Mono",monospace}
.shell{display:flex;height:calc(100vh - 54px)}
.sidebar{width:220px;flex-shrink:0;background:var(--sf);border-right:1px solid var(--bd);padding:16px 0;overflow-y:auto}
.nav-sec{font-size:10px;font-weight:600;letter-spacing:.08em;color:var(--inkf);text-transform:uppercase;padding:12px 18px 5px}
.nav-item{display:flex;align-items:center;gap:9px;padding:8px 18px;font-size:13px;color:var(--inkm);cursor:pointer;border-left:3px solid transparent;transition:all .12s;user-select:none}
.nav-item:hover{background:var(--bg);color:var(--ink)}
.nav-item.active{background:var(--gp);color:var(--g3);border-left-color:var(--g3);font-weight:500}
.nav-item svg{width:15px;height:15px;flex-shrink:0;opacity:.7}
.nav-count{margin-left:auto;font-size:10px;font-weight:600;padding:1px 6px;border-radius:8px;background:var(--gl);color:var(--g3)}
.nav-count.red{background:var(--rdl);color:var(--rd)}
.owner-avatar{width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:600;color:#fff;flex-shrink:0}
.main{flex:1;overflow-y:auto;padding:22px 24px 40px}
.btn{padding:7px 15px;border-radius:var(--r);border:1px solid var(--bd);background:var(--sf);color:var(--ink);cursor:pointer;font-family:"DM Sans",sans-serif;font-size:13px;font-weight:500;display:inline-flex;align-items:center;gap:6px;transition:all .12s;white-space:nowrap}
.btn:hover{background:var(--bg)}
.btn-primary{background:var(--g3);color:#fff;border-color:var(--g3)}
.btn-primary:hover{background:var(--g2)}
.btn-sm{padding:4px 10px;font-size:12px}
.btn-ghost{border-color:transparent;background:transparent}
.btn-ghost:hover{background:var(--bg)}
.btn-danger{color:var(--rd);border-color:#f5c6c2}
.btn-danger:hover{background:var(--rdl)}
.ph{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;flex-wrap:wrap;gap:10px}
.ph-title{font-size:19px;font-weight:600;letter-spacing:-.3px}
.ph-sub{font-size:12px;color:var(--inkg);margin-top:2px}
.metrics{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px;margin-bottom:18px}
.mc{background:var(--sf);border:1px solid var(--bd);border-radius:var(--rl);padding:14px 16px}
.mc-label{font-size:11px;color:var(--inkg);font-weight:500;text-transform:uppercase;letter-spacing:.05em}
.mc-val{font-size:26px;font-weight:600;margin-top:3px;letter-spacing:-.5px}
.mc-val.g{color:var(--g3)}.mc-val.b{color:var(--bl)}.mc-val.a{color:var(--am)}.mc-val.r{color:var(--rd)}
.alerts{display:flex;flex-direction:column;gap:5px;margin-bottom:14px}
.alert{border-radius:var(--r);padding:8px 13px;font-size:12px;display:flex;align-items:flex-start;gap:7px;line-height:1.5}
.al-w{background:var(--aml);color:#412402;border:1px solid #ef9f27}
.al-d{background:var(--rdl);color:#5c1010;border:1px solid #e24b4a}
.alert svg{width:14px;height:14px;flex-shrink:0;margin-top:1px}
.toolbar{display:flex;align-items:center;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.toolbar input,.toolbar select{padding:7px 10px;border:1px solid var(--bd);border-radius:var(--r);background:var(--sf);font-family:"DM Sans",sans-serif;font-size:13px;color:var(--ink)}
.toolbar input:focus,.toolbar select:focus{outline:none;border-color:var(--g4)}
.toolbar input[type=text]{width:200px}
.twrap{background:var(--sf);border:1px solid var(--bd);border-radius:var(--rl);overflow:hidden}
table{width:100%;border-collapse:collapse;table-layout:fixed}
thead th{background:#f8f8f4;font-size:11px;font-weight:600;color:var(--inkg);text-transform:uppercase;letter-spacing:.05em;padding:9px 12px;text-align:left;border-bottom:1px solid var(--bd);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
tbody tr{border-bottom:1px solid var(--bd);transition:background .1s}
tbody tr:last-child{border-bottom:none}
tbody tr:hover{background:var(--gp)}
tbody td{padding:10px 12px;font-size:13px;vertical-align:middle;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mono{font-family:"DM Mono",monospace;font-size:11px;color:var(--inkm)}
.badge{display:inline-flex;align-items:center;padding:2px 8px;border-radius:20px;font-size:11px;font-weight:500;white-space:nowrap}
.bg{background:var(--gl);color:#085041}.bb{background:var(--bll);color:var(--bl)}.ba{background:var(--aml);color:#633806}.br{background:var(--rdl);color:var(--rd)}.bgr{background:#f1f0e8;color:var(--inkm)}
.pw{width:90px}.pb{height:5px;border-radius:3px;background:var(--bg);overflow:hidden}.pf{height:100%;border-radius:3px;transition:width .4s}.pl{font-size:10px;color:var(--inkg);margin-top:2px;font-family:"DM Mono",monospace}
.mbd{display:none;position:fixed;inset:0;background:rgba(6,37,24,.55);z-index:300;align-items:flex-start;justify-content:center;padding:36px 16px;overflow-y:auto}
.mbd.open{display:flex}
.modal{background:var(--sf);border-radius:var(--rl);border:1px solid var(--bd);width:100%;max-width:640px;padding:22px}
.modal-title{font-size:16px;font-weight:600;margin-bottom:15px;letter-spacing:-.2px}
.fg{display:grid;grid-template-columns:1fr 1fr;gap:11px}
.ff{grid-column:1/-1}
.fl label{display:block;font-size:11px;font-weight:600;color:var(--inkg);text-transform:uppercase;letter-spacing:.05em;margin-bottom:4px}
.fl input,.fl select{width:100%;padding:7px 10px;border:1px solid var(--bd);border-radius:var(--r);background:var(--sf);font-family:"DM Sans",sans-serif;font-size:13px;color:var(--ink)}
.fl input:focus,.fl select:focus{outline:none;border-color:var(--g4)}
.mf{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}
.step-item{display:flex;align-items:center;gap:9px;padding:8px 10px;border-radius:var(--r);transition:background .1s}
.step-item:hover{background:var(--bg)}
.step-item.cur{background:var(--gp)}
.sc{width:25px;height:25px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:600;flex-shrink:0}
.sc-done{background:var(--gl);color:#085041}.sc-cur{background:var(--g3);color:#fff}.sc-fut{background:var(--bg);color:var(--inkf);border:1px solid var(--bd)}.sc-od{background:var(--rdl);color:var(--rd)}
.sb{flex:1;min-width:0}.sn{font-size:12px;font-weight:500}.sd{font-size:11px;color:var(--inkg);margin-top:1px}
.oi{border:none;border-bottom:1px solid var(--bd);background:transparent;font-family:"DM Sans",sans-serif;font-size:11px;color:var(--ink);padding:1px 4px;width:95px;outline:none}
.oi:focus{border-bottom-color:var(--g4)}
.oi::placeholder{color:var(--inkf);font-style:italic}
.dmeta{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}
.dc{background:var(--bg);border-radius:var(--r);padding:9px 11px}
.dcl{font-size:10px;font-weight:600;color:var(--inkg);text-transform:uppercase;letter-spacing:.05em}
.dcv{font-size:13px;font-weight:500;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.owner-card{background:var(--sf);border:1px solid var(--bd);border-radius:var(--rl);padding:16px;display:flex;flex-direction:column;gap:10px;cursor:pointer}
.owner-card:hover{background:var(--gp)}
.owner-header{display:flex;align-items:center;gap:12px}
.owner-avatar-lg{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:600;color:#fff;flex-shrink:0}
.owner-stats{display:flex;gap:10px;flex-wrap:wrap}
.owner-stat{background:var(--bg);border-radius:var(--r);padding:7px 12px;text-align:center;min-width:60px}
.owner-stat-val{font-size:18px;font-weight:600;letter-spacing:-.3px}
.owner-stat-label{font-size:10px;color:var(--inkg);margin-top:1px}
.task-item{display:flex;align-items:center;gap:8px;padding:7px 10px;border-radius:var(--r);background:var(--bg);margin-bottom:4px;cursor:pointer;transition:background .1s}
.task-item:hover{background:var(--gp)}
.task-item.overdue{background:var(--rdl);border:1px solid #f5c6c2}
.task-item.due-soon{background:var(--aml);border:1px solid #ef9f27}
.setup-step{background:var(--sf);border:1px solid var(--bd);border-radius:var(--rl);padding:16px 18px;margin-bottom:10px;display:flex;gap:14px}
.ss-num{width:28px;height:28px;border-radius:50%;background:var(--g3);color:#fff;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600;flex-shrink:0;margin-top:2px}
.setup-step h4{font-size:14px;font-weight:600;margin-bottom:6px}
.setup-step p{font-size:13px;color:var(--inkm);line-height:1.6}
.wdc{background:var(--gl);color:#085041}.wcp{background:var(--pul);color:#26215c}.wbo{background:var(--aml);color:#633806}.wct{background:#eaf3de;color:#173404}
@media(max-width:700px){.metrics{grid-template-columns:repeat(2,1fr)}.fg{grid-template-columns:1fr}.dmeta{grid-template-columns:1fr 1fr}.sidebar{display:none}.main{padding:14px}}
</style>
</head>
<body>
<div class="topbar">
  <div class="tb-brand">
    <div class="tb-logo"><svg viewBox="0 0 16 16"><path d="M8 1L1 5v6l7 4 7-4V5L8 1zm0 1.9l5 2.9-5 2.9-5-2.9 5-2.9zM2 6.8l5.5 3.2v5.3L2 12V6.8zm7.5 8.5V10l5.5-3.2V12l-5.5 3.3z"/></svg></div>
    <div><div class="tb-name">Freemee</div><div class="tb-sub">Debt Review Admin Tracker 2026</div></div>
  </div>
  <div class="tb-right">
    <div id="sync-dot"></div>
    <span id="sync-txt">Not connected</span>
    <button class="btn btn-sm" style="border-color:rgba(255,255,255,.2);color:#fff;background:transparent;font-size:12px" onclick="showPage('setup')">Setup</button>
  </div>
</div>
<div class="shell">
<nav class="sidebar">
  <div class="nav-sec">Views</div>
  <div class="nav-item active" id="nav-dashboard" onclick="showPage('dashboard')">
    <svg viewBox="0 0 16 16" fill="currentColor"><path d="M1 1h6v6H1zm8 0h6v6H9zM1 9h6v6H1zm8 0h6v6H9z"/></svg>Dashboard</div>
  <div class="nav-item" id="nav-all" onclick="showPage('all')">
    <svg viewBox="0 0 16 16" fill="currentColor"><path d="M2 3h12v2H2zm0 4h12v2H2zm0 4h8v2H2z"/></svg>All clients
    <span class="nav-count" id="nc-all">0</span></div>
  <div class="nav-item" id="nav-overdue" onclick="showPage('overdue')">

    <span class="nav-count red" id="nc-od">0</span></div>
  <div class="nav-item" id="nav-active" onclick="showPage('active')">
    <svg viewBox="0 0 16 16" fill="currentColor"><path d="M3 8a5 5 0 1010 0A5 5 0 003 8zm5-3v3.5l2.5 1.5-.75 1.25L7 9V5h1z"/></svg>Active
    <span class="nav-count" id="nc-act">0</span></div>
  <div class="nav-sec">By owner</div>
  <div class="nav-item" id="nav-Chanel" onclick="showOwner('Chanel')"><div class="owner-avatar" style="background:#0f5c3a">CH</div>Chanel<span class="nav-count red" id="nc-Chanel">0</span></div>
  <div class="nav-item" id="nav-Martinique" onclick="showOwner('Martinique')"><div class="owner-avatar" style="background:#534ab7">MA</div>Martinique<span class="nav-count red" id="nc-Martinique">0</span></div>
  <div class="nav-item" id="nav-Zahra" onclick="showOwner('Zahra')"><div class="owner-avatar" style="background:#ba7517">ZA</div>Zahra<span class="nav-count red" id="nc-Zahra">0</span></div>
  <div class="nav-item" id="nav-Masimba" onclick="showOwner('Masimba')"><div class="owner-avatar" style="background:#185fa5">MS</div>Masimba<span class="nav-count red" id="nc-Masimba">0</span></div>
  <div class="nav-item" id="nav-Adrian" onclick="showOwner('Adrian')"><div class="owner-avatar" style="background:#c0392b">AD</div>Adrian<span class="nav-count red" id="nc-Adrian">0</span></div>
  <div class="nav-item" id="nav-Ethan" onclick="showOwner('Ethan')"><div class="owner-avatar" style="background:#0a3d28">ET</div>Ethan<span class="nav-count red" id="nc-Ethan">0</span></div>
  <div class="nav-item" id="nav-Waseema" onclick="showOwner('Waseema')"><div class="owner-avatar" style="background:#7b2d8b">WA</div>Waseema<span class="nav-count red" id="nc-Waseema">0</span></div>

  <div class="nav-item" id="nav-setup" onclick="showPage('setup')">
    <svg viewBox="0 0 16 16" fill="currentColor"><path d="M6.5 1l-.5 2A5 5 0 003 4.8L1 4 0 5.7l1.8 1A5 5 0 002 8c0 .45.06.9.17 1.3L.5 10.3 1.5 12l2-.8A5 5 0 005.5 13L6 15h4l.5-2A5 5 0 0013 11.2l2 .8 1-1.7-1.7-1A5 5 0 0014 8c0-.45-.06-.9-.17-1.3L15.5 5.7 14.5 4l-2 .8A5 5 0 0010.5 3L10 1H6.5zM8 6a2 2 0 110 4A2 2 0 018 6z"/></svg>Setup</div>
</nav>
<main class="main" id="mc"></main>
</div>

<div class="mbd" id="modal-ce">
  <div class="modal">
    <div class="modal-title" id="mt">Add new client</div>
    <div class="fg">
      <div class="fl"><label>Surname *</label><input id="f-sn" type="text"/></div>
      <div class="fl"><label>First name *</label><input id="f-nm" type="text"/></div>

<script>
// ═══════════════════════════════════════════════════════════════════════════════
// FREEMEE DASHBOARD — COMPLETE SCRIPT
// ═══════════════════════════════════════════════════════════════════════════════

// ── Step definitions ──────────────────────────────────────────────────────────
// col = exact column name in spreadsheet (including spaces/special chars)
const STEPS=[
  {n:1, title:"Application received",       col:null,                          dueCol:null,                           who:"DC",  tag:"dc",    owner:"Chanel"},
  {n:2, title:"ID received",                col:"ID received",                 dueCol:null,                           who:"DC",  tag:"dc",    owner:"Chanel"},
  {n:3, title:"17.1 sent to CPs",           col:"17.1 sent\u00a0 Date",       dueCol:"17.1 Due Date",                who:"DC",  tag:"dc",    owner:"Chanel"},
  {n:4, title:"COB received",               col:"Cob received ",               dueCol:"COB Due Date",                 who:"CP",  tag:"cp",    owner:"Martinique"},
  {n:5, title:"17.2 sent",                  col:"17.2 Sent Date",              dueCol:null,                           who:"DC",  tag:"dc",    owner:"Zahra"},
  {n:6, title:"Proposal sent",              col:"Proposal sent date",          dueCol:"Proposal Due Date",            who:"DC",  tag:"dc",    owner:"Masimba"},
  {n:7, title:"Client calc sent",           col:"Client Calc sent?",           dueCol:"Client Calc date sent",        who:"DC",  tag:"dc",    owner:"Adrian"},
  {n:8, title:"Acceptances received",       col:"Acceptances Received",        dueCol:"Acceptances Due Date",         who:"CP",  tag:"cp",    owner:"Zahra"},
  {n:9, title:"Acceptance sent to client",  col:"Acceptance sent To client? ", dueCol:"Acceptance sent To client date",who:"DC", tag:"dc",   owner:"Ethan"},
  {n:10,title:"Rework if required",         col:"Rework",                      dueCol:"Rework Date",                  who:"DC",  tag:"dc",    owner:"Masimba"},
  {n:11,title:"Final proposal sent",        col:"Final Proposal Date",         dueCol:"Final Proposal Due Date",      who:"DC",  tag:"dc",    owner:"Masimba"},
  {n:12,title:"Send to legal",              col:"Send to Legal ?",             dueCol:null,                           who:"DC",  tag:"dc",    owner:"Waseema"},
  {n:13,title:"Infusion replaced",          col:"Infusion Replaced ?",         dueCol:null,                           who:"DC",  tag:"dc",    owner:"Zahra"},
  {n:14,title:"Court order granted",        col:"Court Order",                 dueCol:null,                           who:"DC",  tag:"court", owner:"Waseema"},
];

// ── Owner definitions ─────────────────────────────────────────────────────────
const OWNERS={
  Chanel:    {color:"#0f5c3a",initials:"CH",steps:[0,1,2]},
  Martinique:{color:"#534ab7",initials:"MA",steps:[3]},
  Zahra:     {color:"#ba7517",initials:"ZA",steps:[4,7,12]},
  Masimba:   {color:"#185fa5",initials:"MS",steps:[5,9,10]},
  Adrian:    {color:"#c0392b",initials:"AD",steps:[6]},
  Ethan:     {color:"#0a3d28",initials:"ET",steps:[8]},
  Waseema:   {color:"#7b2d8b",initials:"WA",steps:[11,13]},
};

// ── NCR business day deadlines from Sale Date ─────────────────────────────────
const BDAYS=[0,0,5,5,15,15,25,35,35,60,null,null,null,null];

function addBDays(dateStr,n){
  if(n===null||!dateStr)return null;
  try{
    let d=new Date(dateStr);
    if(isNaN(d))return null;
    let added=0;
    while(added<n){d.setDate(d.getDate()+1);const day=d.getDay();if(day!==0&&day!==6)added++;}
    return d;
  }catch(e){return null;}
}

function getNcrDueDate(client,stepIdx){
  const bd=stepIdx<BDAYS.length?BDAYS[stepIdx]:null;
  if(bd===null)return null;
  const sd=client['Sale Date'];
  if(!sd)return null;
  return addBDays(sd,bd);
}

// ── Utility functions ─────────────────────────────────────────────────────────
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6);}

function fmtDate(d){
  if(!d||d==='')return'—';
  try{const dt=new Date(d);if(isNaN(dt))return d;return dt.toLocaleDateString('en-ZA',{day:'2-digit',month:'short',year:'numeric'});}
  catch{return d;}
}

function fmtR(v){
  const n=parseFloat(v);
  if(isNaN(n))return v||'—';
  return'R '+Math.round(n).toLocaleString('en-ZA');
}

function isDateVal(v){
  if(!v)return false;
  if(v instanceof Date)return true;
  if(typeof v==='string'&&v.match(/^\d{4}-\d{2}-\d{2}/))return true;
  return false;
}

function daysDiff(d){
  if(!d)return null;
  const now=new Date();now.setHours(0,0,0,0);
  const dd=new Date(d);dd.setHours(0,0,0,0);
  return Math.round((dd-now)/86400000);
}

// ── Step completion — checks actual spreadsheet column value ──────────────────
function isStepDone(c,stepIdx){
  if(stepIdx===0)return true;
  const col=STEPS[stepIdx]?STEPS[stepIdx].col:null;
  if(!col)return false;
  let v=c[col];
  if(v===undefined){
    const norm=col.replace(/[\s\u00a0]+/g,' ').trim();
    const key=Object.keys(c).find(k=>k.replace(/[\s\u00a0]+/g,' ').trim()===norm);
    v=key?c[key]:undefined;
  }
  if(v===undefined||v===null)return false;
  const vs=String(v).trim().toLowerCase();
  return vs!==''&&vs!=='no'&&vs!=='none';
}

// ── Current step (1-based) — first incomplete step ────────────────────────────
function deriveStep(c){
  for(let i=1;i<STEPS.length;i++){if(!isStepDone(c,i))return i+1;}
  return STEPS.length+1;
}

// ── Step status ───────────────────────────────────────────────────────────────
function stepStatus(c,stepIdx){
  if(isStepDone(c,stepIdx))return'done';
  const cs=deriveStep(c)-1;
  if(stepIdx>cs)return'future';
  const due=getNcrDueDate(c,stepIdx);
  if(due){
    const diff=daysDiff(due);
    if(diff!==null&&diff<0)return'overdue';
    if(diff!==null&&diff<=3)return'due-soon';
  }
  return'inprogress';
}

// ── Client overall status ─────────────────────────────────────────────────────
function clientStatus(c){
  const cs=deriveStep(c);
  if(cs>STEPS.length)return'done';
  const stat=(c['Client Status']||'').toLowerCase().trim();
  if(stat==='cancelled'||stat==='terminated')return'cancelled';
  for(let i=0;i<STEPS.length;i++){
    if(!isStepDone(c,i)&&stepStatus(c,i)==='overdue')return'overdue';
  }
  return'inprogress';
}

function clientProgress(c){
  const cs=deriveStep(c);
  return cs>STEPS.length?100:Math.round(((cs-1)/STEPS.length)*100);
}

// ── Owner tasks — all outstanding steps per owner ─────────────────────────────
function getOwnerTasks(ownerName){
  const info=OWNERS[ownerName];if(!info)return[];
  const tasks=[];
  clients.forEach(c=>{
    // Skip cancelled / terminated clients only
    const stat=(c['Client Status']||'').toLowerCase().trim();
    if(stat==='cancelled'||stat==='terminated')return;
    info.steps.forEach(stepIdx=>{
      // Only include if this specific step is NOT done
      if(isStepDone(c,stepIdx))return;
      const s=STEPS[stepIdx];
      // Calculate status DIRECTLY from NCR deadline — bypass stepStatus
      // stepStatus marks steps 'future' if a prior step is incomplete
      // but owners need to see ALL their outstanding steps
      const due=getNcrDueDate(c,stepIdx);
      const diff=due?daysDiff(due):null;
      let status;
      if(diff===null)      status='inprogress';
      else if(diff<0)      status='overdue';
      else if(diff<=3)     status='due-soon';
      else                 status='inprogress';
      tasks.push({client:c,step:s,stepIdx,due,diff,status});
    });
  });
  return tasks.sort((a,b)=>{
    if(a.status==='overdue'&&b.status!=='overdue')return-1;
    if(b.status==='overdue'&&a.status!=='overdue')return 1;
    if(a.diff!==null&&b.diff!==null)return a.diff-b.diff;
    return 0;
  });
}

// ── Month sidebar builder ─────────────────────────────────────────────────────
const MONTH_ORDER=['jan','feb','mar','apr','may','jun','jul','aug','sep','oct','nov','dec'];

function sortMonths(months){
  return [...months].sort((a,b)=>{
    const aL=a.toLowerCase(),bL=b.toLowerCase();
    const aY=parseInt(aL.match(/\d{4}/)?.[0]||'0'),bY=parseInt(bL.match(/\d{4}/)?.[0]||'0');
    if(aY!==bY)return aY-bY;
    return MONTH_ORDER.findIndex(m=>aL.includes(m))-MONTH_ORDER.findIndex(m=>bL.includes(m));
  });
}

function shortMonthName(s){
  const l=s.toLowerCase();
  const map={jan:'Jan',feb:'Feb',mar:'Mar',apr:'Apr',may:'May',jun:'Jun',jul:'Jul',aug:'Aug',sep:'Sep',oct:'Oct',nov:'Nov',dec:'Dec'};
  const yr=s.match(/\d{4}/)?.[0]||'';
  for(const[k,v]of Object.entries(map)){if(l.includes(k))return`${v} ${yr}`;}
  return s;
}

function buildMonthsSidebar(){
  const sheets=[...new Set(clients.map(c=>c._sheet).filter(Boolean))];
  const sorted=sortMonths(sheets);
  const container=document.getElementById('months-nav');
  if(!container)return;
  container.innerHTML='';
  sorted.forEach(sheetName=>{
    const count=clients.filter(c=>(c._sheet||'').trim()===sheetName).length;
    const safeId='nav-month-'+sheetName.replace(/\s/g,'_');
    const div=document.createElement('div');
    div.className='nav-item';div.id=safeId;
    div.innerHTML=`${shortMonthName(sheetName)} <span class="nav-count" id="nc-${safeId}">${count}</span>`;
    div.onclick=()=>filterMonth(sheetName);
    container.appendChild(div);
  });
}

// ── State ─────────────────────────────────────────────────────────────────────
let clients=[];
let editingId=null;
let scriptUrl=localStorage.getItem('fm_gs_url')||'';
let syncTimer=null;
let curPage='dashboard';
let monthFilter=null;
let ownerFilter=null;

// ── Sync ──────────────────────────────────────────────────────────────────────
function setSyncUI(state,msg){
  const dot=document.getElementById('sync-dot');
  const txt=document.getElementById('sync-txt');
  if(dot)dot.className=state==='ok'?'ok':'';
  if(txt)txt.textContent=msg;
}

async function syncGet(){
  if(!scriptUrl)return;
  try{
    const r=await fetch(scriptUrl+'?action=get&t='+Date.now());
    const d=await r.json();
    if(d.error){setSyncUI('err','Error: '+d.error);return;}
    if(d.clients&&d.clients.length>0){
      clients=d.clients;
      setSyncUI('ok','Synced '+new Date().toLocaleTimeString('en-ZA',{hour:'2-digit',minute:'2-digit'})+' ('+clients.length+')');
      buildMonthsSidebar();refreshAll();
    }else{setSyncUI('err','Connected but no data found');}
  }catch(e){setSyncUI('err','Sync failed');}
}

async function syncWrite(action,payload){
  if(!scriptUrl){refreshAll();return;}
  try{await fetch(scriptUrl+'?action='+action,{method:'POST',body:JSON.stringify(payload)});await syncGet();}
  catch(e){setSyncUI('err','Write failed');refreshAll();}
}

function startSync(){
  if(syncTimer)clearInterval(syncTimer);
  if(!scriptUrl)return;
  setSyncUI('ok','Connecting...');
  syncGet();
  syncTimer=setInterval(syncGet,30000);
}

// ── Navigation ────────────────────────────────────────────────────────────────
function showPage(p){
  curPage=p;monthFilter=null;ownerFilter=null;
  document.querySelectorAll('.nav-item').forEach(el=>el.classList.remove('active'));
  const nav=document.getElementById('nav-'+p);if(nav)nav.classList.add('active');
  _renderPage();
}

function showOwner(name){
  curPage='owner';ownerFilter=name;monthFilter=null;
  document.querySelectorAll('.nav-item').forEach(el=>el.classList.remove('active'));
  const nav=document.getElementById('nav-'+name);if(nav)nav.classList.add('active');
  _renderPage();
}

function filterMonth(m){
  curPage='month';monthFilter=m;ownerFilter=null;
  document.querySelectorAll('.nav-item').forEach(el=>el.classList.remove('active'));
  const safeId='nav-month-'+m.replace(/\s/g,'_');
  const nav=document.getElementById(safeId);if(nav)nav.classList.add('active');
  _renderPage();
}

function _renderPage(){
  const mc=document.getElementById('mc');
  if(curPage==='dashboard')renderDashboard(mc);
  else if(curPage==='all')renderTable(mc,clients,'All clients');
  else if(curPage==='overdue')renderTable(mc,clients.filter(c=>clientStatus(c)==='overdue'),'Overdue steps');
  else if(curPage==='active')renderTable(mc,clients.filter(c=>clientStatus(c)==='inprogress'),'Active clients');
  else if(curPage==='month')renderTable(mc,clients.filter(c=>(c._sheet||'').trim()===monthFilter),monthFilter);
  else if(curPage==='owner')renderOwnerPage(mc,ownerFilter);
  else if(curPage==='setup')renderSetup(mc);
}

function refreshAll(){updateCounts();_renderPage();}

function updateCounts(){
  const set=(id,v)=>{const el=document.getElementById(id);if(el)el.textContent=v;};
  set('nc-all',clients.length);
  set('nc-od',clients.filter(c=>clientStatus(c)==='overdue').length);
  set('nc-act',clients.filter(c=>clientStatus(c)==='inprogress').length);
  Object.keys(OWNERS).forEach(name=>{
    const tasks=getOwnerTasks(name);
    set('nc-'+name,tasks.filter(t=>t.status==='overdue'||t.status==='due-soon'||t.status==='inprogress').length);
  });
  const sheets=[...new Set(clients.map(c=>c._sheet).filter(Boolean))];
  sheets.forEach(s=>{
    const safeId='nav-month-'+s.replace(/\s/g,'_');
    const el=document.getElementById('nc-'+safeId);
    if(el)el.textContent=clients.filter(c=>(c._sheet||'').trim()===s).length;
  });
}

function renderDashboard(el){
  const total=clients.length;
  const active=clients.filter(c=>clientStatus(c)==='inprogress').length;
  const overdue=clients.filter(c=>clientStatus(c)==='overdue').length;
  const done=clients.filter(c=>clientStatus(c)==='done').length;
  const cancelled=clients.filter(c=>clientStatus(c)==='cancelled').length;
  const alerts=clients.filter(c=>clientStatus(c)==='overdue').slice(0,4).map(c=>{
    const cs=deriveStep(c)-1;const s=STEPS[Math.min(cs,STEPS.length-1)];
    const due=getNcrDueDate(c,cs);const diff=due?daysDiff(due):null;
    return`<strong>${c.Surname||''} ${c.Name||''}</strong> — Step ${s.n}: ${s.title} · Owner: <strong>${s.owner}</strong>${diff!==null?' ('+Math.abs(diff)+'d overdue)':''}`;
  });
  const ownerCards=Object.entries(OWNERS).map(([name,info])=>{
    const tasks=getOwnerTasks(name);
    const od=tasks.filter(t=>t.status==='overdue').length;
    const ds=tasks.filter(t=>t.status==='due-soon').length;
    const tot=tasks.length;
    return`<div class="owner-card" onclick="showOwner('${name}')">
      <div class="owner-header">
        <div class="owner-avatar-lg" style="background:${info.color}">${info.initials}</div>
        <div style="flex:1"><div style="font-size:14px;font-weight:600">${name}</div>
        <div style="font-size:11px;color:var(--inkg)">Steps ${info.steps.map(i=>i+1).join(', ')}</div></div>
        ${od>0?`<span class="badge br">${od} overdue</span>`:ds>0?`<span class="badge ba">${ds} due soon</span>`:`<span class="badge bg">On track</span>`}
      </div>

        <div class="owner-stat"><div class="owner-stat-val" style="color:var(--rd)">${od}</div><div class="owner-stat-label">Overdue</div></div>
        <div class="owner-stat"><div class="owner-stat-val" style="color:var(--am)">${ds}</div><div class="owner-stat-label">Due soon</div></div>
        <div class="owner-stat"><div class="owner-stat-val" style="color:var(--g3)">${tot-od-ds}</div><div class="owner-stat-label">On track</div></div>
      </div>
    </div>`;
  }).join('');
  const sheets=[...new Set(clients.map(c=>c._sheet).filter(Boolean))];
  const sortedSheets=sortMonths(sheets);
  const monthBars=sortedSheets.map(m=>{

  }).join('');
  const dist=Array(STEPS.length).fill(0);
  clients.forEach(c=>{const s=deriveStep(c)-1;if(s>=0&&s<dist.length)dist[s]++;});
  const topStep=dist.indexOf(Math.max(...dist));
  el.innerHTML=`

  updateCounts();
}

// ── Table view ────────────────────────────────────────────────────────────────
function renderTable(el,list,title){
  el.innerHTML=`
    <div class="ph"><div><div class="ph-title">${title}</div><div class="ph-sub">${list.length} client${list.length!==1?'s':''}</div></div><button class="btn btn-primary" onclick="openAdd()">+ Add client</button></div>
    <div class="toolbar">
      <input type="text" id="tq" placeholder="Search name or ID..." oninput="filterSearch(this.value,${JSON.stringify(list).replace(/"/g,'&quot;').replace(/'/g,'&#39;')},'${title}')"/>
      <select onchange="filterStep(this.value)"><option value="">All steps</option>${STEPS.map(s=>`<option value="${s.n}">Step ${s.n}: ${s.title} (${s.owner})</option>`).join('')}</select>
      <select onchange="filterOwnerTable(this.value)"><option value="">All owners</option>${Object.keys(OWNERS).map(n=>`<option>${n}</option>`).join('')}</select>
      <select onchange="filterPDA(this.value)"><option value="">All PDAs</option><option>Finwise</option><option>Hyphen</option><option>RMS</option></select>
    </div>
    ${list.length===0?`<div style="text-align:center;padding:50px;color:var(--inkg)">No clients match</div>`:
    `<div class="twrap"><table>
      <thead><tr><th style="width:140px">Client</th><th style="width:100px">ID</th><th style="width:70px">PDA</th><th style="width:80px">Sale date</th><th style="width:130px">Step</th><th style="width:80px">Owner</th><th style="width:80px">Status</th><th style="width:80px">Progress</th><th style="width:50px"></th></tr></thead>
      <tbody>${list.map(c=>clientRow(c)).join('')}</tbody>
    </table></div>`}`;
}

function filterSearch(q,list,title){
  const qs=q.toLowerCase();
  const fl=qs?list.filter(c=>(c.Surname||'').toLowerCase().includes(qs)||(c.Name||'').toLowerCase().includes(qs)||String(c['ID Number']||'').includes(qs)):list;
  renderTable(document.getElementById('mc'),fl,title);
}
function filterStep(v){if(v)renderTable(document.getElementById('mc'),clients.filter(c=>deriveStep(c)===parseInt(v)+1||deriveStep(c)===parseInt(v)),`Step ${v} clients`);else _renderPage();}
function filterOwnerTable(v){if(!v){_renderPage();return;}const info=OWNERS[v];if(!info)return;renderTable(document.getElementById('mc'),clients.filter(c=>info.steps.includes(deriveStep(c)-1)),v+"'s clients");}
function filterPDA(v){if(v)renderTable(document.getElementById('mc'),clients.filter(c=>c.PDA===v),v+' clients');else _renderPage();}

function clientRow(c){
  const cs=clientStatus(c);
  const stepIdx=deriveStep(c)-1;
  const s=STEPS[Math.min(stepIdx,STEPS.length-1)];
  const prog=clientProgress(c);
  const pc=cs==='done'?'var(--g4)':cs==='overdue'?'var(--rd)':'var(--bl)';
  const sb=cs==='done'?'<span class="badge bg">Done</span>':cs==='overdue'?'<span class="badge br">Overdue</span>':cs==='cancelled'?'<span class="badge bgr">Cancelled</span>':'<span class="badge bb">Active</span>';
  const ow=OWNERS[s.owner]||{color:'#888',initials:'?'};
  const name=`${c.Surname||''} ${c.Name||''}`.trim()||'Unknown';
  return`<tr><td style="cursor:pointer;font-weight:500" onclick="openDetail('${c._id}')">${name}</td><td class="mono">${String(c['ID Number']||'').slice(0,13)||'—'}</td><td>${c.PDA||'—'}</td><td style="font-size:12px">${fmtDate(c['Sale Date'])}</td><td style="font-size:12px"><strong>${s.n}.</strong> ${s.title}</td><td><div style="display:flex;align-items:center;gap:5px"><div class="owner-avatar" style="background:${ow.color}">${ow.initials}</div><span style="font-size:12px">${s.owner}</span></div></td><td>${sb}</td><td><div class="pw"><div class="pb"><div class="pf" style="width:${prog}%;background:${pc}"></div></div><div class="pl">${prog}%</div></div></td><td><button class="btn btn-sm btn-ghost" onclick="openDetail('${c._id}')">View</button></td></tr>`;
}

// ── Client detail modal ───────────────────────────────────────────────────────
function openDetail(id){
  const c=clients.find(x=>x._id===id);if(!c)return;
  const prog=clientProgress(c);const cs=clientStatus(c);
  const name=`${c.Surname||''} ${c.Name||''}`.trim();
  const stepsHtml=STEPS.map((s,i)=>{
    const ss=stepStatus(c,i);const isCur=i===deriveStep(c)-1;
    const cc=ss==='done'?'sc-done':ss==='overdue'?'sc-od':isCur?'sc-cur':'sc-fut';
    const due=getNcrDueDate(c,i);const diff=due?daysDiff(due):null;
    const dt=diff!==null?(diff<0?`<span class="badge br" style="font-size:10px">${Math.abs(diff)}d overdue</span>`:diff===0?`<span class="badge ba" style="font-size:10px">Today</span>`:diff<=3?`<span style="font-size:10px;color:var(--am)">${diff}d</span>`:`<span style="font-size:10px;color:var(--inkg)">${diff}d</span>`):'';
    const cv=s.col?c[s.col]:'';const cvs=cv&&isDateVal(cv)?fmtDate(cv):(cv||'');
    const ow=OWNERS[s.owner]||{color:'#888',initials:'?'};
    const wtag={dc:'wdc',cp:'wcp',both:'wbo',court:'wct'}[s.tag]||'';
    const ab=ss!=='done'&&ss!=='future'?`<button class="btn btn-sm" onclick="advStep('${c._id}',${i})" style="font-size:11px;flex-shrink:0">Done</button>`:'';
    return`<div class="step-item${isCur?' cur':''}">
      <div class="sc ${cc}">${ss==='done'?'✓':s.n}</div>
      <div class="sb">
        <div class="sn">${s.title}${cvs?` <span style="color:var(--g3);font-size:10px">— ${cvs}</span>`:''}</div>
        <div class="sd"><span class="badge ${wtag}" style="font-size:10px;padding:1px 6px">${s.who}</span>&nbsp;<span style="display:inline-flex;align-items:center;gap:3px"><div class="owner-avatar" style="background:${ow.color};width:14px;height:14px;font-size:7px">${ow.initials}</div><span style="font-size:10px">${s.owner}</span></span>&nbsp;${dt}</div>
      </div>${ab}
    </div>`;
  }).join('');
  document.getElementById('dt-content').innerHTML=`
    <div style="display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:12px;gap:10px;flex-wrap:wrap">
      <div><div style="font-size:18px;font-weight:600;letter-spacing:-.3px">${name}</div>
      <div style="font-size:12px;color:var(--inkg);margin-top:3px">${cs==='done'?'<span class="badge bg">Completed</span>':cs==='overdue'?'<span class="badge br">Overdue</span>':cs==='cancelled'?'<span class="badge bgr">Cancelled</span>':'<span class="badge bb">Active</span>'}&nbsp;${c._sheet||''}</div></div>
      <div style="text-align:right;flex-shrink:0"><div style="font-size:22px;font-weight:600;color:var(--g3)">${prog}%</div><div style="font-size:11px;color:var(--inkg)">Step ${Math.min(deriveStep(c),STEPS.length)} of ${STEPS.length}</div></div>
    </div>
    <div style="height:4px;border-radius:2px;background:var(--bg);margin-bottom:14px;overflow:hidden"><div style="height:100%;border-radius:2px;background:${cs==='overdue'?'var(--rd)':cs==='done'?'var(--g4)':'var(--bl)'};width:${prog}%;transition:width .4s"></div></div>
    <div class="dmeta">
      <div class="dc"><div class="dcl">ID number</div><div class="dcv mono" style="font-size:12px">${c['ID Number']||'—'}</div></div>
      <div class="dc"><div class="dcl">Lead</div><div class="dcv">${c.lead||'—'}</div></div>
      <div class="dc"><div class="dcl">Closer</div><div class="dcv">${c.closer||'—'}</div></div>
      <div class="dc"><div class="dcl">Debit order</div><div class="dcv">${fmtR(c['Debit Order Amount'])}</div></div>
      <div class="dc"><div class="dcl">DC value</div><div class="dcv">${fmtR(c['DC Value'])}</div></div>
      <div class="dc"><div class="dcl">Sale type</div><div class="dcv">${c['Sale Type']||'—'}</div></div>
      <div class="dc"><div class="dcl">DHS status</div><div class="dcv">${c['DHS status']||'—'}</div></div>
      <div class="dc"><div class="dcl">Payment method</div><div class="dcv">${c['Payment Method']||'—'}</div></div>
      <div class="dc"><div class="dcl">Client status</div><div class="dcv">${c['Client Status']||'—'}</div></div>
    </div>
    <div style="font-size:11px;color:var(--inkg);margin-bottom:7px">Click <strong>Done</strong> to advance a step.</div>
    <div style="max-height:360px;overflow-y:auto">${stepsHtml}</div>`;
  document.getElementById('dt-edit').onclick=()=>editClient(c._id);
  document.getElementById('dt-del').onclick=()=>{if(confirm(`Remove ${name}?`)){clients=clients.filter(x=>x._id!==c._id);syncWrite('delete',{id:c._id});closeM('modal-dt');refreshAll();}};
  document.getElementById('modal-dt').classList.add('open');
}

async function advStep(cid,stepIdx){
  const c=clients.find(x=>x._id===cid);if(!c)return;
  const s=STEPS[stepIdx];
  if(s&&s.col){c[s.col]=new Date().toISOString().split('T')[0];}
  await syncWrite('update',c);
  openDetail(cid);refreshAll();
}

// ── Add / Edit ────────────────────────────────────────────────────────────────
function openAdd(){
  editingId=null;document.getElementById('mt').textContent='Add new client';
  ['f-sn','f-nm','f-id','f-lead','f-cl','f-doa','f-dcv','f-dhs','f-as'].forEach(id=>{const el=document.getElementById(id);if(el)el.value='';});
  document.getElementById('f-sd').value=new Date().toISOString().split('T')[0];
  ['f-pda','f-pm','f-st'].forEach(id=>{const el=document.getElementById(id);if(el)el.value='';});
  document.getElementById('f-cs').value='Active';
  const mo=document.getElementById('f-mo');
  if(mo){const sheets=sortMonths([...new Set(clients.map(c=>c._sheet).filter(Boolean))]);mo.innerHTML=sheets.map(s=>`<option value="${s}">${s}</option>`).join('');mo.value=sheets[sheets.length-1]||'';}
  document.getElementById('modal-ce').classList.add('open');
}

function editClient(id){
  const c=clients.find(x=>x._id===id);if(!c)return;
  closeM('modal-dt');editingId=id;document.getElementById('mt').textContent='Edit client';
  document.getElementById('f-sn').value=c.Surname||'';document.getElementById('f-nm').value=c.Name||'';
  document.getElementById('f-id').value=c['ID Number']||'';document.getElementById('f-sd').value=c['Sale Date']||'';
  document.getElementById('f-pda').value=c.PDA||'';document.getElementById('f-pm').value=c['Payment Method']||'';
  document.getElementById('f-lead').value=c.lead||'';document.getElementById('f-cl').value=c.closer||'';
  document.getElementById('f-doa').value=c['Debit Order Amount']||'';document.getElementById('f-dcv').value=c['DC Value']||'';
  document.getElementById('f-st').value=(c['Sale Type']||'').trim();document.getElementById('f-cs').value=c['Client Status']||'';
  document.getElementById('f-dhs').value=c['DHS status']||'';document.getElementById('f-as').value=c['Application status']||'';
  document.getElementById('modal-ce').classList.add('open');
}

async function saveClient(){
  const sn=document.getElementById('f-sn').value.trim();const sd=document.getElementById('f-sd').value;
  if(!sn||!sd){alert('Please enter surname and sale date.');return;}
  const data={Surname:sn,Name:document.getElementById('f-nm').value.trim(),'ID Number':document.getElementById('f-id').value.trim(),'Sale Date':sd,PDA:document.getElementById('f-pda').value,'Payment Method':document.getElementById('f-pm').value,lead:document.getElementById('f-lead').value.trim(),closer:document.getElementById('f-cl').value.trim(),'Debit Order Amount':document.getElementById('f-doa').value.trim(),'DC Value':document.getElementById('f-dcv').value.trim(),'Sale Type':document.getElementById('f-st').value,'Client Status':document.getElementById('f-cs').value,'DHS status':document.getElementById('f-dhs').value.trim(),'Application status':document.getElementById('f-as').value.trim()};
  if(editingId){const c=clients.find(x=>x._id===editingId);Object.assign(c,data);await syncWrite('update',c);}
  else{const nc={...data,_id:uid(),_sheet:document.getElementById('f-mo').value,_currentStep:1,_owners:{}};clients.push(nc);await syncWrite('add',nc);}
  closeM('modal-ce');refreshAll();
}

function closeM(id){document.getElementById(id).classList.remove('open');}
